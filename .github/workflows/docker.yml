name: docker

# 只在打 tag 或手动触发时构建，避免每次 push 都出版本。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 额外打一个自定义镜像标签（留空则只用 semver 与 latest）
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `workflow_dispatch` 没有 tag，metadata-action 取不到 semver，所以版本号
      # 统一从 package.json 读，作为 OCI 标签的 org.opencontainers.image.version。
      - id: appver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # 仓库名已是全小写，符合 GHCR 要求。
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # arm64 走 QEMU 模拟。本镜像只做 COPY、不编译，所以模拟构造成本很低。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.pushed_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建完成后把镜像摘要写进 job summary，便于核对"这个 tag 对应哪次提交"。
      # runner 自带 docker，所以推送后可以真拉下来核对：标签是否写进去了、
      # 多架构清单是否齐全。这两样在别处（无 read:packages 权限时）都查不到。
      - id: verify
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          docker pull "$IMAGE"
          echo '--- OCI labels ---'
          docker image inspect "$IMAGE" --format '{{json .Config.Labels}}' | tr ',' '\n'
          echo '--- base image ---'
          docker image inspect "$IMAGE" --format '{{.Config.Env}}'
          echo '--- platforms in manifest ---'
          docker buildx imagetools inspect "$IMAGE" | sed -n '1,20p'

      - id: summary
        run: |
          {
            echo "### 镜像已推送"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ''
            echo "digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
