name: test

# Offline checks: the suites never touch the network. This repository ships no
# in-app updater and no signed manifest, so there is no release-signing job —
# the release records under catalog/ are verified by catalog-test.mjs instead.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      # `catalog-test.mjs` compares the recorded revision against the last commit that
      # touched the release content, and it can only do that with history to walk.
      # checkout's default `fetch-depth: 1` leaves a single commit with no parent to
      # diff against, so that walk answers HEAD for any path list — which made the gate
      # fail on every commit that only refreshes the catalog records, on `main` and on
      # pull requests alike (where HEAD is GitHub's throwaway merge ref).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Source regressions also exercise real Cordis/LLM contracts and the
      # vendored transport dependencies. Lifecycle scripts stay disabled;
      # the suites themselves use isolated credentials and local upstreams.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      # 产物新鲜度门禁（scripts/artifact-freshness-test.mjs）要**真的重建** pack.js
      # 与独立端页面才能逐字节比对，因此需要 esbuild 与 vite。此前它们只从
      # root devDependencies 找 —— 而那里根本没有 esbuild，`--ignore-scripts` 也
      # 装不出平台二进制，于是那两道 check 在 CI 里**恒为「跳过」**，把
      # 「改了 vendor/channel-pack/src 忘重打包」这一类事故原样放行
      # （2026-11-25 run 45524879215 的日志实证）。独立端的 devDependencies 正好
      # 同时提供 esbuild 0.25.9 与 vite。
      - name: Install build toolchain for artifact gates
        run: npm ci --prefix packages/standalone --ignore-scripts
      # `--ignore-scripts` 不会跑 esbuild 的 postinstall，所以 `esbuild/bin/esbuild`
      # 这层包装不存在 —— 门禁改用平台包里的原生二进制（`ESBUILD_BINARY_PATH`）。
      # npm 解包一般已带 0755，但这里显式补一次，免得镜像/umask 差异让它变成
      # 「找不到工具链 → 跳过 → 假绿」。两处是**不同版本**（pack 用 0.25.9，
      # Vite 自带 0.28.2），别合并成一条。
      - name: Make esbuild native binaries runnable
        run: |
          chmod +x packages/standalone/node_modules/@esbuild/*/bin/esbuild
          chmod +x packages/standalone/node_modules/vite/node_modules/@esbuild/*/bin/esbuild
      - name: Validate code or the complete main tree
        env:
          TEST_MODE: ${{ github.event_name == 'pull_request' && 'contributor' || 'all' }}
        run: node scripts/test-all.mjs --mode "$TEST_MODE"

  # The adapter seam (and only it) is kept under strict TypeScript checking. This
  # job installs development dependencies without running lifecycle scripts.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      # Channel Pack 的 vendor 树（20 个渠道）也在严格检查内。2026-10-31 起要求
      # 0 错误：`@types/node@22`（CI 的 node 22 自带）+ tsconfig 的 DOM lib。
      # 此前 vendor/ 不跑 tsc，`async listAccounts` 当同步用烧掉 OfficeAce
      # 续期链、providerRetryPolicy 缺 mode 无限重试这类缺陷全都能活到线上。
      - run: npm run typecheck:channels

  standalone-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --prefix packages/standalone --ignore-scripts
      - run: npm run typecheck:standalone
      - run: node scripts/build-standalone-ui.mjs --check
